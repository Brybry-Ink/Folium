<!DOCTYPE html>
<html>
<head>
  <title>Folium - Install Multiple Apps at Once</title>
  <link rel="icon" href="icons/leaf.png">     <!-- <a href="https://www.flaticon.com/free-icons/leaves" title="leaves icons">Leaves icons created by Icongeek26 - Flaticon</a> -->
  <link rel="stylesheet" href="styles.css">
  <link href='https://fonts.googleapis.com/css?family=Noto Sans' rel='stylesheet'>
  <link rel="xylem" href="sap.js">
</head>
<script src="sap.js"></script>


<body>
  <form method="post">
    <div class="container">
      <h3 class="center-text">Pick your apps</h3>
    </div>
      <div>
      <ul class="list-unstyled center-block" style="position: relative; width: 1785px; height: 785px;">

        <li class="app-section" style="position: absolute; left: 0px; top: 0px;">
          <h4>Web Browsers</h4>

          <ul class="list-unstyled">
            <li>
              <label for="cb_chrome" class="app-label" title="Chrome by Google">
                <input type="checkbox" name="apps" value="Google.Chrome" id="cb_chrome">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/Chrome.png" alt="Chrome icon">
                Chrome
              </label>
            </li>
          </ul>

          <ul class="list-unstyled">
            <li>
              <label for="cb_firefox" class="app-label" title="Firefox by Mozilla">
                <input type="checkbox" name="apps" value="Mozilla.Firefox" id="cb_firefox">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/firefox.png" alt="Firefox icon">
                Firefox
              </label>
            </li>
          </ul>

          <ul class="list-unstyled">
            <li>
              <label for="cb_opera" class="app-label" title="Opera by Opera Software">
                <input type="checkbox" name="apps" value="Opera.Opera" id="cb_opera">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/opera.png" alt="Opera icon">
                Opera
              </label>
            </li>
          </ul>


          <ul class="list-unstyled">
            <li>
              <label for="cb_operagx" class="app-label" title="OperaGX by Opera Software">
                <input type="checkbox" name="apps" value="Opera.OperaGX" id="cb_operagx">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/operagx.png" alt="Opera GX icon">
                Opera GX
              </label>
            </li>
          </ul>
          
          <ul class="list-unstyled">
            <li>
              <label for="cb_brave" class="app-label" title="Brave by Brave Software">
                <input type="checkbox" name="apps" value="Brave.Brave" id="cb_brave">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/brave.png" alt="Brave icon">
                Brave
              </label>
            </li>
          </ul>
        

        </li>

        <li class="app-section" style="position: absolute; left: 0px; top: 150px;">
          <h4>Communication</h4>

          <ul class="list-unstyled">
            <li>
              <label for="cb_zoom" class="app-label" title="Zoom by Zoom Communications">
                <input type="checkbox" name="apps" value="Zoom.Zoom" id="cb_zoom">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/zoom.png" alt="Zoom icon">
                Zoom
              </label>
            </li>
          </ul>

          <ul class="list-unstyled">
            <li>
              <label for="cb_discord" class="app-label" title="Discord by Discord Inc.">
                <input type="checkbox" name="apps" value="Discord.Discord" id="cb_discord">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/discord.png" alt="Discord icon">
                Discord
              </label>
            </li>
          </ul>


        </li>


        <li class="app-section" style="position: absolute; left: 0px; top: 250px;">
          <h4>Media</h4>

          <ul class="list-unstyled">
            <li>
              <label for="cb_vlc" class="app-label" title="VLC by VideoLAN">
                <input type="checkbox" name="apps" value="VideoLAN.VLC" id="cb_vlc">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/vlc.png" alt="VLC icon">
                VLC
              </label>
            </li>
          </ul>

          <ul class="list-unstyled">
            <li>
              <label for="cb_itunes" class="app-label" title="iTunes by Apple">
                <input type="checkbox" name="apps" value="Apple.iTunes" id="cb_itunes">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/itunes.png" alt="iTunes icon">
                iTunes
              </label>
            </li>
          </ul>

          <ul class="list-unstyled">
            <li>
              <label for="cb_applemusic" class="app-label" title="Apple Music by Apple">
                <input type="checkbox" name="apps" value="9PFHDD62MXS1" id="cb_applemusic">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/applemusic.png" alt="Apple Music icon">
                Apple Music
              </label>
            </li>
          </ul>

          <ul class="list-unstyled">
            <li>
              <label for="cb_spotify" class="app-label" title="Spotify by Spotify Technology S.A.">
                <input type="checkbox" name="apps" value="9PFHDD62MXS1" id="cb_spotify">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/spotify.png" alt="Spotify icon">
                Spotify
              </label>
            </li>
          </ul>

          <ul class="list-unstyled">
            <li>
              <label for="cb_audacity" class="app-label" title="Audacity by Muse Group">
                <input type="checkbox" name="apps" value="Audacity.Audacity" id="cb_audacity">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/audacity.png" alt="Audacity icon">
                Audacity
              </label>
            </li>
          </ul>

          <ul class="list-unstyled">
            <li>
              <label for="cb_handbrake" class="app-label" title="HandBrake by HandBrake Team">
                <input type="checkbox" name="apps" value="HandBrake.HandBrake" id="cb_handbrake">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/handbrake.png" alt="HandBrake icon">
                HandBrake
              </label>
            </li>
          </ul>


        </li>


      </ul>    
      </div>


              <center><button class="round-button" type="button" onclick="genBatchFile()">Download Here</button></center>


  </form>

  <div class="footer">
    <div class="body center-text">
      <ul class="list">
        <li>
          <a class="footer-link" href="https://github.com/Brybry-Ink/Folium" target="_blank">Github</a>
        </li>
      </ul>
    </div>
  </div>
</body>
</html>
