<!DOCTYPE html>
<html>
<head>
  <title>Folium - Install Multiple Apps at Once</title>
  <link rel="icon" href="icons/leaf.png">     <!-- <a href="https://www.flaticon.com/free-icons/leaves" title="leaves icons">Leaves icons created by Icongeek26 - Flaticon</a> -->
  <link rel="stylesheet" href="styles.css">
  <link href='https://fonts.googleapis.com/css?family=Noto Sans' rel='stylesheet'>
  <link rel="xylem" href="sap.js">
</head>
<script src="sap.js"></script>


<body>
  <form method="post">
    <div class="container">
      <h3 class="center-text">Pick your apps</h3>
    

      <div class="section-group">

        <!-- web browsers -->
        <div class="app-section">
          <h4>Web Browsers</h4>
          <ul class="list-unstyled">

            
            <label for="cb_chrome" class="app-label" title="Chrome by Google">
              <input type="checkbox" name="apps" value="Google.Chrome" id="cb_chrome">
              <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/Chrome.png" alt="Chrome icon">
              Chrome
            </label>
            
            <label for="cb_firefox" class="app-label" title="Firefox by Mozilla">
              <input type="checkbox" name="apps" value="Mozilla.Firefox" id="cb_firefox">
              <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/firefox.png" alt="Firefox icon">
              Firefox
            </label>

            <label for="cb_opera" class="app-label" title="Opera by Opera Software">
              <input type="checkbox" name="apps" value="Opera.Opera" id="cb_opera">
              <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/opera.png" alt="Opera icon">
              Opera
            </label>

            <label for="cb_operagx" class="app-label" title="OperaGX by Opera Software">
              <input type="checkbox" name="apps" value="Opera.OperaGX" id="cb_operagx">
              <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/operagx.png" alt="Opera GX icon">
              Opera GX
            </label>

            <label for="cb_brave" class="app-label" title="Brave by Brave Software">
              <input type="checkbox" name="apps" value="Brave.Brave" id="cb_brave">
              <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/brave.png" alt="Brave icon">
              Brave
            </label>

          </ul>
        </div>


        <!-- communication -->
        <div class="app-section">
          <h4>Communication</h4>
          <ul class="list-unstyled">


              <label for="cb_zoom" class="app-label" title="Zoom by Zoom Communications">
                <input type="checkbox" name="apps" value="Zoom.Zoom" id="cb_zoom">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/zoom.png" alt="Zoom icon">
                Zoom
              </label>

              <label for="cb_thunderbird" class="app-label" title="Thunderbird by Mozilla">
                <input type="checkbox" name="apps" value="Mozilla.Thunderbird" id="cb_thunderbird">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/thunderbird.png" alt="Thunderbird icon">
                Thunderbird
              </label>

              <label for="cb_whatsapp" class="app-label" title="Whatsapp by Meta Platforms, Inc.">
                <input type="checkbox" name="apps" value="9NKSQGP7F2NH" id="cb_whatsapp">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/whatsapp.png" alt="Whatsapp icon">
                Whatsapp
              </label>
        
              <label for="cb_discord" class="app-label" title="Discord by Discord Inc.">
                <input type="checkbox" name="apps" value="Discord.Discord" id="cb_discord">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/discord.png" alt="Discord icon">
                Discord
              </label>
        
          </ul>
        </div>


        <div class="app-section">
          <h4>Media</h4>
          <ul class="list-unstyled">


              <label for="cb_vlc" class="app-label" title="VLC by VideoLAN">
                <input type="checkbox" name="apps" value="VideoLAN.VLC" id="cb_vlc">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/vlc.png" alt="VLC icon">
                VLC
              </label>

              <label for="cb_itunes" class="app-label" title="iTunes by Apple">
                <input type="checkbox" name="apps" value="Apple.iTunes" id="cb_itunes">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/itunes.png" alt="iTunes icon">
                iTunes
              </label>

              <label for="cb_applemusic" class="app-label" title="Apple Music by Apple">
                <input type="checkbox" name="apps" value="9PFHDD62MXS1" id="cb_applemusic">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/applemusic.png" alt="Apple Music icon">
                Apple Music
              </label>

              <label for="cb_spotify" class="app-label" title="Spotify by Spotify Technology S.A.">
                <input type="checkbox" name="apps" value="9PFHDD62MXS1" id="cb_spotify">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/spotify.png" alt="Spotify icon">
                Spotify
              </label>

              <label for="cb_audacity" class="app-label" title="Audacity by Muse Group">
                <input type="checkbox" name="apps" value="Audacity.Audacity" id="cb_audacity">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/audacity.png" alt="Audacity icon">
                Audacity
              </label>

              <label for="cb_handbrake" class="app-label" title="HandBrake by HandBrake Team">
                <input type="checkbox" name="apps" value="HandBrake.HandBrake" id="cb_handbrake">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/handbrake.png" alt="HandBrake icon">
                HandBrake
              </label>

          </ul> 
        </div>


        <!-- java -->
        <div class="app-section">
          <h4>Java</h4>
          <ul class="list-unstyled">


              <label for="cb_java8" class="app-label" title="Java 8 by Oracle">
                <input type="checkbox" name="apps" value="Oracle.JavaRuntimeEnvironment" id="cb_java8">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/java.png" alt="Java 8 icon">
                Java 8
              </label>

              <label for="cb_jdk24" class="app-label" title="JDK24 by Oracle">
                <input type="checkbox" name="apps" value="Oracle.JDK.24" id="cb_jdk24">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/java.png" alt="JDK 24 icon">
                Java JDK 24
              </label>

              <label for="cb_jdk23" class="app-label" title="JDK23 by Oracle">
                <input type="checkbox" name="apps" value="Oracle.JDK.23" id="cb_jdk23">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/java.png" alt="JDK 23 icon">
                Java JDK 23
              </label>

              <label for="cb_jdk21" class="app-label" title="JDK21 by Oracle">
                <input type="checkbox" name="apps" value="Oracle.JDK.21" id="cb_jdk21">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/java.png" alt="JDK 21 icon">
                Java JDK 21
              </label>

          </ul> 
        </div>


        <!-- cloud storage -->
        <div class="app-section">
          <h4>Cloud Storage</h4>
          <ul class="list-unstyled">


              <label for="cb_googledrive" class="app-label" title="Google Drive by Google">
                <input type="checkbox" name="apps" value="Google.GoogleDrive" id="cb_googledrive">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/googledrive.png" alt="Google Drive icon">
                Google Drive
              </label>

              <label for="cb_icloud" class="app-label" title="iCloud by Apple">
                <input type="checkbox" name="apps" value="Apple.iCloud" id="cb_icloud">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/icloud.png" alt="iCloud icon">
                iCloud
              </label>

              <label for="cb_dropbox" class="app-label" title="Dropbox by Dropbox">
                <input type="checkbox" name="apps" value="Dropbox.Dropbox" id="cb_dropbox">
                <img style="width: 16px; height: 14px; margin-bottom: -1px;" src="icons/dropbox.png" alt="Dropbox icon">
                Dropbox
              </label>

              <label for="cb_onedrive" class="app-label" title="OneDrive by Microsoft">
                <input type="checkbox" name="apps" value="Microsoft.OneDrive" id="cb_onedrive">
                <img style="width: 16px; height: 14px; margin-bottom: -1px;" src="icons/onedrive.png" alt="OneDrive icon">
                OneDrive
              </label>

              <label for="cb_protondrive" class="app-label" title="Proton Drive by Proton">
                <input type="checkbox" name="apps" value="Proton.ProtonDrive" id="cb_protondrive">
                <img style="width: 16px; height: 14px; margin-bottom: -1px;" src="icons/protondrive.png" alt="Proton Drive icon">
                Proton Drive
              </label>

          </ul> 
        </div>


        <!-- creative software -->
        <div class="app-section">
          <h4>Creative Software</h4>
          <ul class="list-unstyled">


              <label for="cb_adobereader" class="app-label" title="Adobe Acrobat Reader by Adobe Inc.">
                <input type="checkbox" name="apps" value="Adobe.Acrobat.Reader.64-bit" id="cb_adobereader">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/adobereader.png" alt="Adobe Acrobat Reader icon">
                Acrobat Reader
              </label>

              <label for="cb_blender" class="app-label" title="Blender by Blender Foundation">
                <input type="checkbox" name="apps" value="BlenderFoundation.Blender" id="cb_blender">
                <img style="width: 16px; height: 14px; margin-bottom: -1px;" src="icons/blender.png" alt="Blender icon">
                Blender
              </label>

              <label for="cb_paintnet" class="app-label" title="Paint.NET by dotPDN LLC">
                <input type="checkbox" name="apps" value="dotPDN.PaintDotNet" id="cb_paintnet">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/paintnet.png" alt="Paint.NET icon">
                Paint.NET
              </label>

              <label for="cb_gimp" class="app-label" title="GIMP by GIMP">
                <input type="checkbox" name="apps" value="GIMP.GIMP.3" id="cb_gimp">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/gimp.png" alt="GIMP icon">
                GIMP 3
              </label>

              <label for="cb_krita" class="app-label" title="Krita by Krita Foundation">
                <input type="checkbox" name="apps" value="KDE.Krita" id="cb_krita">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/krita.png" alt="Krita icon">
                Krita
              </label>

              <label for="cb_Inkscape" class="app-label" title="Inkscape by Inkscape Project">
                <input type="checkbox" name="apps" value="Inkscape.Inkscape" id="cb_Inkscape">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/inkscape.png" alt="Incscape icon">
                Inkscape
              </label>


          </ul> 
        </div>
        

        <!-- comression -->
        <div class="app-section">
          <h4>Compression</h4>
          <ul class="list-unstyled">


              <label for="cb_winrar" class="app-label" title="WinRAR by RARLab">
                <input type="checkbox" name="apps" value="RARLab.WinRAR" id="cb_winrar">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/winrar.png" alt="WinRAR icon">
                WinRAR
              </label>

              <label for="cb_7zip" class="app-label" title="Z-Zip by Z-Zip">
                <input type="checkbox" name="apps" value="7zip.7zip" id="cb_7zip">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/7zip.png" alt="7-Zip icon">
                7-Zip
              </label>

          </ul> 
        </div>


        <!-- other -->
        <div class="app-section">
          <h4>Other</h4>
          <ul class="list-unstyled">


              <label for="cb_steam" class="app-label" title="Steam by Valve Software">
                <input type="checkbox" name="apps" value="Valve.Steam" id="cb_steam">
                <img style="width: 16px; height: 16px; margin-bottom: -2px;" src="icons/steam.png" alt="Steam icon">
                Steam
              </label>

              <label for="cb_epicgames" class="app-label" title="Epic Games by Epic Games, Inc.">
                <input type="checkbox" name="apps" value="EpicGames.EpicGamesLauncher" id="cb_epicgames">
                <img style="width: 16px; height: 20px; margin-bottom: -4px;" src="icons/epicgames.png" alt="7-Zip icon">
                Epic Games
              </label>

          </ul> 
        </div>







              
      </div>
    </div>
  </form>

              <center><button class="round-button" type="button" onclick="genBatchFile()">Download Here</button></center>


  <div class="footer">
    <div class="body center-text">
      <ul class="list">
        <li>
          <a class="footer-link" href="https://github.com/Brybry-Ink/Folium" target="_blank">Github</a>
        </li>
      </ul>
    </div>
  </div>
</body>
</html>
